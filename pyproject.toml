[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris"
version = "0.1.0"
description = "Jardín de Roko JR-0.1: vertical slice de pensamiento complejo con alineamiento solarpunk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Jardín de Roko" }]
keywords = ["alignment", "complexity", "solarpunk", "agent", "simulation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]
nn = [
  "torch>=2.3",
  "numpy>=1.26",
]
local = [
  "transformers>=4.41",
  "llama-cpp-python>=0.2.79",
]
api = [
  "httpx>=0.27",
]

[project.scripts]
solaris = "solaris.cli:main"

[tool.setuptools.packages.find]
include = ["solaris*"]

[tool.setuptools.package-data]
solaris = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "contract: contract tests for module boundaries",
  "integration: end-to-end vertical slice tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["solaris"]
